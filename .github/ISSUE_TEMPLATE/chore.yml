name: 🔧 Chore / Maintenance
description: Request a code cleanup, refactor, dependency update, or tooling change
title: "[Chore]: "
labels: ["chore", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for maintenance tasks, refactors, dependency updates, or tooling changes.

  - type: dropdown
    id: type
    attributes:
      label: Chore Type
      options:
        - Dependency Update
        - Code Refactor
        - Build / Tooling Change
        - CI/CD Improvement
        - Documentation
        - Performance Optimization
        - Tech Debt Cleanup
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why?
      placeholder: Describe the chore...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] All tests pass
        - [ ] Build succeeds
        - [ ] ...
