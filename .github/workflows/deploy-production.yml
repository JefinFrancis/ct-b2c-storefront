# ──────────────────────────────────────────────────────────────────────────────
# Deploy Production — Manual deploy main branch to GCP Cloud Run (production)
# Requires manual approval from a maintainer
# ──────────────────────────────────────────────────────────────────────────────
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release?'
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Never cancel production deploys

env:
  NODE_VERSION: '20'
  GCP_REGION: us-central1
  API_SERVICE_NAME: ct-b2c-api-prod
  WEB_SERVICE_NAME: ct-b2c-web-prod

jobs:
  # ── Validate ─────────────────────────────────────────────────────────────
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate branch
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$CURRENT_BRANCH" != "main" ]; then
            echo "❌ Production deploys must be from main branch (current: $CURRENT_BRANCH)"
            exit 1
          fi
          echo "✅ Deploying from main branch"

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Version must follow semver format: v1.0.0"
            exit 1
          fi
          echo "✅ Version format valid: ${{ inputs.version }}"

  # ── CI Gate ──────────────────────────────────────────────────────────────
  ci:
    name: CI Checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  # ── Build & Push Docker Images ───────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image tags
        id: tags
        run: |
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ct-b2c-images"
          VERSION="${{ inputs.version }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "api_version=${REGISTRY}/api:${VERSION}" >> $GITHUB_OUTPUT
          echo "api_sha=${REGISTRY}/api:${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "api_latest=${REGISTRY}/api:latest" >> $GITHUB_OUTPUT
          echo "web_version=${REGISTRY}/web:${VERSION}" >> $GITHUB_OUTPUT
          echo "web_sha=${REGISTRY}/web:${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "web_latest=${REGISTRY}/web:latest" >> $GITHUB_OUTPUT

      - name: Build & Push API image
        run: |
          docker build \
            --build-arg NODE_ENV=production \
            -t ${{ steps.tags.outputs.api_version }} \
            -t ${{ steps.tags.outputs.api_sha }} \
            -t ${{ steps.tags.outputs.api_latest }} \
            -f apps/api/Dockerfile \
            apps/api
          docker push ${{ steps.tags.outputs.api_version }}
          docker push ${{ steps.tags.outputs.api_sha }}
          docker push ${{ steps.tags.outputs.api_latest }}

      - name: Build & Push Web image
        run: |
          docker build \
            --build-arg NODE_ENV=production \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_PROD }} \
            --build-arg NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL_PROD }} \
            -t ${{ steps.tags.outputs.web_version }} \
            -t ${{ steps.tags.outputs.web_sha }} \
            -t ${{ steps.tags.outputs.web_latest }} \
            -f apps/web/Dockerfile \
            apps/web
          docker push ${{ steps.tags.outputs.web_version }}
          docker push ${{ steps.tags.outputs.web_sha }}
          docker push ${{ steps.tags.outputs.web_latest }}

    outputs:
      api_image: ${{ steps.tags.outputs.api_version }}
      web_image: ${{ steps.tags.outputs.web_version }}

  # ── Deploy API to Cloud Run ──────────────────────────────────────────────
  deploy-api:
    name: Deploy API to Cloud Run (Production)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.API_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build-and-push.outputs.api_image }}
          flags: >-
            --ingress=internal
            --port=8080
            --memory=1Gi
            --cpu=2
            --min-instances=1
            --max-instances=10
            --set-secrets=CTP_PROJECT_KEY=CTP_PROJECT_KEY:latest,CTP_CLIENT_ID=CTP_CLIENT_ID:latest,CTP_CLIENT_SECRET=CTP_CLIENT_SECRET:latest,CTP_AUTH_URL=CTP_AUTH_URL:latest,CTP_API_URL=CTP_API_URL:latest,CTP_SCOPES=CTP_SCOPES:latest,JWT_SECRET=JWT_SECRET:latest,UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest
          env_vars: |
            NODE_ENV=production

  # ── Deploy Web to Cloud Run ──────────────────────────────────────────────
  deploy-web:
    name: Deploy Web to Cloud Run (Production)
    needs: [build-and-push, deploy-api]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Web to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WEB_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build-and-push.outputs.web_image }}
          flags: >-
            --ingress=all
            --port=3000
            --memory=1Gi
            --cpu=2
            --min-instances=1
            --max-instances=20
            --set-secrets=UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest
          env_vars: |
            NODE_ENV=production

  # ── Smoke Test ───────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (Production)
    needs: [deploy-api, deploy-web]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Health check — API
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_API_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ API health check passed"
              exit 0
            fi
            echo "⏳ Attempt $i: API returned $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ API health check failed after 15 attempts"
          exit 1

      - name: Health check — Web
        run: |
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_WEB_URL }}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Web health check passed"
              exit 0
            fi
            echo "⏳ Attempt $i: Web returned $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Web health check failed after 15 attempts"
          exit 1

  # ── Create GitHub Release ────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: smoke-test
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"- %s" | head -50)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline --pretty=format:"- %s")
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body: |
            ## Release ${{ inputs.version }}

            **Deployed:** $(date -u +"%Y-%m-%d %H:%M UTC")
            **Commit:** ${{ github.sha }}

            ### Changes
            ${{ steps.notes.outputs.commits }}
          draft: false
          prerelease: false
