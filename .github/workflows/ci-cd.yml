name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY_REPO: ct-b2c-storefront

jobs:
  test:
    name: Run Tests & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx turbo typecheck

      - name: Run linter
        run: npx turbo lint

      - name: Run tests
        run: npm test
        env:
          # Mock env vars for tests
          CTP_PROJECT_KEY: test-project
          CTP_CLIENT_ID: test-client-id
          CTP_CLIENT_SECRET: test-client-secret
          CTP_AUTH_URL: https://auth.example.com
          CTP_API_URL: https://api.example.com
          CTP_SCOPES: manage_products
          REDIS_URL: redis://localhost:6379
          NEXT_PUBLIC_API_URL: http://localhost:8080

  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      api-image: ${{ steps.image-tags.outputs.api-image }}
      web-image: ${{ steps.image-tags.outputs.web-image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Set image tags
        id: image-tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          API_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/api:${SHORT_SHA}"
          WEB_IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/web:${SHORT_SHA}"
          echo "api-image=${API_IMAGE}" >> $GITHUB_OUTPUT
          echo "web-image=${WEB_IMAGE}" >> $GITHUB_OUTPUT
          echo "API Image: ${API_IMAGE}"
          echo "Web Image: ${WEB_IMAGE}"

      - name: Build and push API image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ steps.image-tags.outputs.api-image }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/api:latest \
            .
          docker push ${{ steps.image-tags.outputs.api-image }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/api:latest

      - name: Build and push Web image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t ${{ steps.image-tags.outputs.web-image }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/web:latest \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.PROD_API_URL }} \
            --build-arg NEXT_PUBLIC_APP_URL=${{ secrets.PROD_WEB_URL }} \
            .
          docker push ${{ steps.image-tags.outputs.web-image }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/web:latest

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://ct-b2c-web-staging-${{ secrets.GCP_PROJECT_ID }}.run.app
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to Cloud Run (Staging)
        run: |
          gcloud run deploy api-staging \
            --image=${{ needs.build-and-push.outputs.api-image }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --min-instances=0 \
            --max-instances=10 \
            --ingress=internal-and-cloud-load-balancing \
            --set-env-vars=NODE_ENV=production \
            --set-secrets=CTP_PROJECT_KEY=CT_PROJECT_KEY:latest \
            --set-secrets=CTP_CLIENT_ID=CT_CLIENT_ID:latest \
            --set-secrets=CTP_CLIENT_SECRET=CT_CLIENT_SECRET:latest \
            --set-secrets=CTP_AUTH_URL=CT_AUTH_URL:latest \
            --set-secrets=CTP_API_URL=CT_API_URL:latest \
            --set-secrets=CTP_SCOPES=CT_SCOPES:latest \
            --set-secrets=REDIS_URL=REDIS_URL_STAGING:latest \
            --allow-unauthenticated

      - name: Get API staging URL
        id: api-url
        run: |
          API_URL=$(gcloud run services describe api-staging --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "api-url=${API_URL}" >> $GITHUB_OUTPUT
          echo "API Staging URL: ${API_URL}"

      - name: Deploy Web to Cloud Run (Staging)
        run: |
          gcloud run deploy web-staging \
            --image=${{ needs.build-and-push.outputs.web-image }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --min-instances=0 \
            --max-instances=10 \
            --ingress=all \
            --set-env-vars=NODE_ENV=production,NEXT_PUBLIC_API_URL=${{ steps.api-url.outputs.api-url }},INTERNAL_API_URL=${{ steps.api-url.outputs.api-url }} \
            --allow-unauthenticated

      - name: Get Web staging URL
        run: |
          WEB_URL=$(gcloud run services describe web-staging --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "Web Staging URL: ${WEB_URL}"
          echo "### 🚀 Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** ${{ steps.api-url.outputs.api-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Web:** ${WEB_URL}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://ct-b2c-web-${{ secrets.GCP_PROJECT_ID }}.run.app
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to Cloud Run (Production)
        run: |
          gcloud run deploy api \
            --image=${{ needs.build-and-push.outputs.api-image }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --memory=2Gi \
            --cpu=2 \
            --timeout=300 \
            --min-instances=1 \
            --max-instances=20 \
            --ingress=internal-and-cloud-load-balancing \
            --set-env-vars=NODE_ENV=production \
            --set-secrets=CTP_PROJECT_KEY=CT_PROJECT_KEY:latest \
            --set-secrets=CTP_CLIENT_ID=CT_CLIENT_ID:latest \
            --set-secrets=CTP_CLIENT_SECRET=CT_CLIENT_SECRET:latest \
            --set-secrets=CTP_AUTH_URL=CT_AUTH_URL:latest \
            --set-secrets=CTP_API_URL=CT_API_URL:latest \
            --set-secrets=CTP_SCOPES=CT_SCOPES:latest \
            --set-secrets=REDIS_URL=REDIS_URL_PROD:latest \
            --allow-unauthenticated

      - name: Get API production URL
        id: api-url
        run: |
          API_URL=$(gcloud run services describe api --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "api-url=${API_URL}" >> $GITHUB_OUTPUT
          echo "API Production URL: ${API_URL}"

      - name: Deploy Web to Cloud Run (Production)
        run: |
          gcloud run deploy web \
            --image=${{ needs.build-and-push.outputs.web-image }} \
            --platform=managed \
            --region=${{ env.GCP_REGION }} \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --min-instances=1 \
            --max-instances=20 \
            --ingress=all \
            --set-env-vars=NODE_ENV=production,NEXT_PUBLIC_API_URL=${{ steps.api-url.outputs.api-url }},INTERNAL_API_URL=${{ steps.api-url.outputs.api-url }} \
            --allow-unauthenticated

      - name: Get Web production URL
        run: |
          WEB_URL=$(gcloud run services describe web --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "Web Production URL: ${WEB_URL}"
          echo "### ✅ Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** ${{ steps.api-url.outputs.api-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Web:** ${WEB_URL}" >> $GITHUB_STEP_SUMMARY
